<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Bibel-Worte – Statuskarten und begleitende Texte in Deutsch, Englisch und Französisch.">
  <title>Bibel-Worte</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #24302a;
      --muted: #66736c;
      --paper: #fbfaf6;
      --card: #ffffff;
      --line: #dedfd8;
      --accent: #496a58;
      --accent-soft: #e8eee9;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 16px/1.6 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header {
      padding: 4.5rem 1.25rem 3.5rem;
      text-align: center;
      background: linear-gradient(145deg, #edf2ed 0%, #fbfaf6 70%);
      border-bottom: 1px solid var(--line);
    }
    header p { max-width: 680px; margin: .75rem auto 0; color: var(--muted); }
    h1 { margin: 0; font: 700 clamp(2.3rem, 7vw, 4.6rem)/1.05 Georgia, serif; letter-spacing: -.03em; }
    main { width: min(1120px, calc(100% - 2rem)); margin: 0 auto; padding: 2.5rem 0 4rem; }
    .toolbar { display: flex; gap: .5rem; justify-content: center; margin-bottom: 2rem; flex-wrap: wrap; }
    button {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: .55rem 1rem;
      background: var(--card);
      color: var(--ink);
      cursor: pointer;
      font: inherit;
    }
    button[aria-pressed="true"] { color: #fff; border-color: var(--accent); background: var(--accent); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 310px), 1fr)); gap: 1.5rem; }
    article { overflow: hidden; border: 1px solid var(--line); border-radius: 18px; background: var(--card); box-shadow: 0 10px 28px rgb(36 48 42 / 7%); }
    article img { display: block; width: 100%; height: auto; aspect-ratio: 9 / 16; object-fit: contain; background: #000; }
    .copy { padding: 1.25rem 1.35rem 1.5rem; }
    .meta { color: var(--accent); font-size: .86rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
    h2 { margin: .3rem 0 .4rem; font: 700 1.65rem/1.2 Georgia, serif; }
    .verse { margin: 0 0 .8rem; color: var(--muted); font-style: italic; }
    .description { margin: 0; }
    .download { display: inline-block; margin-top: 1rem; color: var(--accent); font-weight: 650; text-decoration-thickness: 1px; text-underline-offset: 3px; }
    .status { text-align: center; color: var(--muted); padding: 2rem; }
    footer { padding: 2rem 1rem 3rem; text-align: center; color: var(--muted); font-size: .9rem; }
  </style>
</head>
<body>
  <header>
    <h1>Bibel-Worte</h1>
    <p>Gedanken aus der Bibel – als Statuskarten und kurze Impulse in drei Sprachen.</p>
  </header>
  <main>
    <nav class="toolbar" aria-label="Sprache wählen">
      <button type="button" data-lang="de" aria-pressed="true">Deutsch</button>
      <button type="button" data-lang="en" aria-pressed="false">English</button>
      <button type="button" data-lang="fr" aria-pressed="false">Français</button>
    </nav>
    <div id="status" class="status">Inhalte werden geladen …</div>
    <section id="cards" class="grid" aria-live="polite"></section>
  </main>
  <footer>© Andreas Hardt · Bibel-Worte</footer>
  <script>
    const labels = {
      de: { download: 'Statuskarte öffnen', empty: 'Zurzeit sind keine Beiträge veröffentlicht.' },
      en: { download: 'Open status card', empty: 'No posts are currently published.' },
      fr: { download: 'Ouvrir la carte', empty: 'Aucun article n’est publié actuellement.' }
    };
    let manifest = { items: [] };
    let language = 'de';

    const escapeHtml = value => String(value ?? '').replace(/[&<>"]/g, char => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'
    }[char]));

    function imageUrl(path) {
      return String(path).split('/').map(encodeURIComponent).join('/');
    }

    function render() {
      const cards = document.querySelector('#cards');
      const status = document.querySelector('#status');
      const items = [...manifest.items].sort((a, b) => b.releaseDate.localeCompare(a.releaseDate));
      status.hidden = items.length > 0;
      status.textContent = labels[language].empty;
      cards.innerHTML = items.map(item => {
        const text = item.languages?.[language];
        if (!text) return '';
        const src = imageUrl(text.imagePath);
        return `<article>
          <a href="${src}" target="_blank" rel="noopener"><img src="${src}" alt="${escapeHtml(text.title)}" loading="lazy"></a>
          <div class="copy">
            <div class="meta">${escapeHtml(item.releaseDate)} · ${escapeHtml(text.bibleReference)}</div>
            <h2>${escapeHtml(text.title)}</h2>
            <p class="verse">${escapeHtml(text.bibleText)}</p>
            <p class="description">${escapeHtml(text.shortDescription)}</p>
            <a class="download" href="${src}" target="_blank" rel="noopener">${labels[language].download}</a>
          </div>
        </article>`;
      }).join('');
    }

    document.querySelectorAll('[data-lang]').forEach(button => {
      button.addEventListener('click', () => {
        language = button.dataset.lang;
        document.documentElement.lang = language;
        document.querySelectorAll('[data-lang]').forEach(item => item.setAttribute('aria-pressed', String(item === button)));
        render();
      });
    });

    fetch('published/manifest.json', { cache: 'no-cache' })
      .then(response => {
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.json();
      })
      .then(data => { manifest = data; render(); })
      .catch(() => { document.querySelector('#status').textContent = 'Die Inhalte konnten nicht geladen werden.'; });
  </script>
</body>
</html>
